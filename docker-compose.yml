services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wager
      POSTGRES_USER: wager
      POSTGRES_PASSWORD: wager
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wager -d wager"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EC2_METADATA_DISABLED: "true"
    ports: ["4566:4566"]
    volumes:
      - ./docker/localstack-init.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q '\"sqs\": \"running\"'"]
      start_period: 20s
      interval: 5s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8080:8080"]
    volumes:
      - ./docker/keycloak/realm-wager.json:/opt/keycloak/data/import/realm-wager.json:ro
  api:
    build: .
    command: sh -c "bun run migration:up && bun run start"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wager:wager@postgres:5432/wager
      REDIS_URL: redis://redis:6379
      SQS_ENDPOINT: http://localstack:4566
      SQS_EVENT_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      SQS_WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      # Tokens are issued to the browser by localhost; the API resolves keys
      # through Docker's internal network.
      OIDC_ISSUER_URL: http://localhost:8080/realms/wager
      OIDC_JWKS_URL: http://keycloak:8080/realms/wager/protocol/openid-connect/certs
      OIDC_AUDIENCE: wager-api
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      localstack: { condition: service_healthy }
      keycloak: { condition: service_started }
  worker:
    build: .
    command: sh -c "bun run migration:up && bun run start:worker"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wager:wager@postgres:5432/wager
      REDIS_URL: redis://redis:6379
      SQS_ENDPOINT: http://localstack:4566
      SQS_EVENT_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      SQS_WAGER_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      localstack: { condition: service_healthy }
volumes:
  postgres_data:
  localstack_data:
